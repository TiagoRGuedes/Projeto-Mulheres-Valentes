spring.datasource.url=jdbc:h2:mem:mulheresvalentes-test;DB_CLOSE_DELAY=-1;MODE=STRICT
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.thymeleaf.cache=false
app.dados-demonstracao=false
app.admin-inicial.nome=Administração Teste
app.admin-inicial.login=admin
app.admin-inicial.senha=senha-inicial-teste
app.notificacoes.verificacao-automatica=false
app.comprovantes.diretorio=${java.io.tmpdir}/mulheresvalentes-comprovantes-teste
