spring.application.name=Mulheres Valentes
server.port=8080

spring.datasource.url=jdbc:h2:file:./dados/mulheresvalentes
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=false
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

server.error.whitelabel.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.timeout=8h
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

app.dados-demonstracao=true

# Acesso da equipe (RNF04), em versao de prototipo: uma conta so.
# Sem valor padrao de proposito: a aplicacao nao sobe se as variaveis nao
# estiverem definidas, para que nenhuma senha fique versionada aqui.
app.admin.usuario=${MV_ADMIN_USUARIO}
app.admin.senha=${MV_ADMIN_SENHA}
