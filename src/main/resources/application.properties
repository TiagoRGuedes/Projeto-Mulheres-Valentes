spring.application.name=Mulheres Valentes
server.port=8080

spring.datasource.url=jdbc:h2:file:./dados/mulheresvalentes
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=false
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

server.error.whitelabel.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.timeout=8h

app.dados-demonstracao=true

# Login (RNF04)
# Primeira conta de administração, criada só quando não existe nenhum usuário.
# Deixe a senha vazia para o sistema gerar uma e mostrar no terminal ao iniciar.
app.admin-inicial.nome=Administração
app.admin-inicial.login=admin
app.admin-inicial.senha=
# Perdeu a senha do admin? Inicie uma vez com app.admin-inicial.redefinir=true
# (veja o README, seção "Perdi a senha"). Depois volte para false.
app.admin-inicial.redefinir=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
