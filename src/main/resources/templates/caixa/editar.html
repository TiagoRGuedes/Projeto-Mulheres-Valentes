<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Corrigir lançamento')}"></head>
<body th:class="|fonte-${preferencias.tamanhoFonte} ${preferencias.altoContraste ? 'alto-contraste' : ''} ${preferencias.modoEscuro ? 'modo-escuro' : ''} ${preferencias.reduzirAnimacoes ? 'reduzir-animacoes' : ''}|">
<header th:replace="~{fragments/header :: header}"></header>
<div class="estrutura-app">

    <main id="conteudo" class="conteudo-principal conteudo-estreito" tabindex="-1">

        <section th:replace="~{caixa/formulario :: formulario('Corrigir lançamento', 'Revise os campos e salve a informação corrigida.', '/caixa/movimentacoes/' + ${lancamentoId} + '/editar', 'Salvar correção', 'botao-primario')}"></section>

</div>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
